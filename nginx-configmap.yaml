apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  nginx.conf: |
    events {}

    http {
      access_log /var/log/nginx/access.log;

      server {
        listen 80;

        location / {
          return 200 'Hello from NGINX!\n';
          add_header Content-Type text/plain;
        }

        location /nginx_status {
          stub_status;
          allow 127.0.0.1;
          deny all;
        }
      }
    }
apiVersion: v1
kind: Pod
metadata:
  name: nginx-sidecar-pod
  namespace: default
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9113"
    prometheus.io/path: "/metrics"
spec:
  volumes:
    - name: nginx-logs
      emptyDir: {}

    - name: nginx-config
      configMap:
        name: nginx-config

    - name: fluentbit-config
      configMap:
        name: fluentbit-config

  containers:
    - name: main-app
      image: nginx:1.25
      ports:
        - containerPort: 80
      volumeMounts:
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    - name: log-sidecar
      image: fluent/fluent-bit:2.1
      args:
        - /fluent-bit/bin/fluent-bit
        - -c
        - /fluent-bit/etc/fluent-bit.conf
      volumeMounts:
        - name: nginx-logs
          mountPath: /var/log/nginx
          readOnly: true
        - name: fluentbit-config
          mountPath: /fluent-bit/etc
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

    - name: metrics-sidecar
      image: nginx/nginx-prometheus-exporter:0.11
      args:
        - -nginx.scrape-uri=http://127.0.0.1/nginx_status
      ports:
        - containerPort: 9113
          name: metrics
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi